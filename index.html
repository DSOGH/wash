<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Landscape Spotify Turntable</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --deck: #1c1d22;
      --accent: #1DB954;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

    body {
      background: var(--bg);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: row;
      height: 100vh;
      overflow: hidden;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Portrait Blocker */
    #portraitWarning {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #000; z-index: 9999; color: #fff; align-items: center; justify-content: center;
      text-align: center; font-size: 20px; font-weight: bold;
    }
    @media (orientation: portrait) {
      #portraitWarning { display: flex; flex-direction: column; gap: 15px; }
      #appContainer { display: none !important; }
    }

    /* Auth Overlay */
    #authOverlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 12, 0.95); z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .btn-spotify {
      background: var(--accent); color: #000; border: none; padding: 15px 30px;
      border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
    }

    /* Main Layout */
    #appContainer { display: none; flex: 1; flex-direction: row; width: 100%; }

    /* Left Side: Turntable */
    .left-panel { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }

    .deck {
      position: relative; width: 380px; height: 350px;
      background: linear-gradient(145deg, #23252c, #141518);
      border-radius: 20px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 20px 40px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* Right Side: UI & Controls */
    .right-panel {
      width: 320px; background: #111115; border-left: 1px solid #222;
      display: flex; flex-direction: column; padding: 20px; z-index: 10;
    }

    .search-container { position: relative; margin-bottom: 20px; z-index: 100; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #09090b; color: #fff; font-size: 16px; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    
    .results-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #18181c; border-radius: 0 0 12px 12px; max-height: 200px; overflow-y: auto; display: none; border: 1px solid #2a2a30; }
    .results-dropdown.active { display: block; }
    .album-item { display: flex; align-items: center; gap: 12px; padding: 10px; cursor: pointer; border-bottom: 1px solid #222; }
    .album-item img { width: 40px; height: 40px; border-radius: 4px; }
    .album-info { flex: 1; overflow: hidden; white-space: nowrap; }
    .album-title { font-size: 13px; font-weight: bold; text-overflow: ellipsis; overflow: hidden; }
    .album-artist { font-size: 11px; color: #888; }

    /* HUD */
    .hud { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .hud-title { font-size: 16px; font-weight: bold; color: var(--accent); margin-bottom: 5px; }
    .hud-meta { font-size: 12px; color: #888; margin-bottom: 20px; }
    .warning { color: #ff4b4b; font-size: 11px; margin-bottom: 10px; font-weight: bold; display: none; }

    /* Controls */
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .btn { padding: 12px; border-radius: 10px; border: none; background: #22222a; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.5; pointer-events: none; }

    /* Platter & Vinyl */
    .platter-wrapper {
      position: absolute; top: 25px; left: 20px; width: 300px; height: 300px;
      perspective: 800px; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
    }
    
    /* Album Swap Animations */
    .platter-wrapper.swapping-out { transform: translateX(-150%) scale(0.8); opacity: 0; }
    .platter-wrapper.swapping-in-prep { transform: translateX(150%) scale(0.8); opacity: 0; transition: none; }

    .platter {
      width: 100%; height: 100%; border-radius: 50%; background: #000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.9), inset 0 0 4px #555;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
    }
    .platter.flipping { transform: rotateY(180deg) scale(0.85); }
    
    .vinyl {
      position: relative; width: 290px; height: 290px; border-radius: 50%;
      background: conic-gradient(from 20deg, transparent 15%, rgba(255,255,255,0.12) 25%, transparent 35%, transparent 65%, rgba(255,255,255,0.12) 75%, transparent 85%), repeating-radial-gradient(circle, #0a0a0c 0px, #0a0a0c 1.5px, #141418 2px);
      display: flex; align-items: center; justify-content: center;
    }
    .vinyl.spinning { animation: spin 1.8s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .grooves-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transform: rotate(-90deg); }
    .center-label { width: 96px; height: 96px; border-radius: 50%; background: #222; background-size: cover; background-position: center; border: 3px solid #000; display: flex; align-items: center; justify-content: center; z-index: 2; }
    .spindle { width: 8px; height: 8px; background: #ccc; border-radius: 50%; }

    /* --- TONEARM & REST HOLDER --- */
    .tonearm-rest {
      position: absolute; bottom: 85px; right: 28px; width: 14px; height: 18px;
      background: #333; border-radius: 4px; border-top: 4px solid #111;
      box-shadow: -2px 4px 6px rgba(0,0,0,0.6); z-index: 8;
    }

    .tonearm-pivot {
      position: absolute; top: 20px; right: 25px; width: 44px; height: 44px;
      background: radial-gradient(circle at 35% 35%, #555, #111); border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.7); z-index: 10;
    }

    .tonearm {
      position: absolute; top: 7px; left: 19px; width: 6px; height: 215px;
      background: linear-gradient(to right, #999, #fff 40%, #666); border-radius: 3px;
      transform-origin: 3px 15px; /* Perfectly centered rotation point */
      transform: rotate(-3deg); /* Exact angle to sit flush on the rest holder */
      cursor: grab; z-index: 9;
    }
    
    /* Dynamic smooth animation class for Auto-Start and Auto-Park */
    .tonearm.swinging { transition: transform 0.6s ease-in-out; }

    .headshell {
      position: absolute; bottom: -12px; left: -8px; width: 22px; height: 32px;
      background: #111; border-radius: 2px; transform: rotate(18deg);
    }
    .stylus-glow { position: absolute; bottom: 2px; left: 9px; width: 4px; height: 4px; background: #1DB954; border-radius: 50%; box-shadow: 0 0 6px #1DB954; }
  </style>
</head>
<body>

  <div id="portraitWarning">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="white"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29.34 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.31.29C4.25 19.94 1.91 16.76 1.55 13H.05C.56 19.16 5.71 23.66 12 24l.66-.03-3.81-3.81-1.33 1.32z"/></svg>
    Please rotate your iPhone to landscape mode.
  </div>

  <div id="authOverlay">
    <h2>Spotify Landscape Turntable</h2>
    <p style="color: #aaa; margin: 10px 0 20px; font-size: 14px;">Requires Spotify Premium</p>
    <button class="btn-spotify" onclick="startSpotifyAuth()">Connect with Spotify</button>
  </div>

  <div id="appContainer">
    <div class="left-panel">
      <div class="deck">
        
        <div class="platter-wrapper" id="platterWrapper">
          <div class="platter" id="platter">
            <div class="vinyl" id="vinyl">
              <svg class="grooves-svg" id="grooveSvg" viewBox="0 0 290 290"></svg>
              <div class="center-label" id="centerLabel"><div class="spindle"></div></div>
            </div>
          </div>
        </div>

        <!-- The physical needle park holder block -->
        <div class="tonearm-rest"></div>
        
        <div class="tonearm-pivot">
          <div class="tonearm" id="tonearm">
            <div class="headshell"><div class="stylus-glow"></div></div>
          </div>
        </div>
        
      </div>
    </div>

    <div class="right-panel">
      <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Spotify..." autocomplete="off">
        <div id="resultsDropdown" class="results-dropdown"></div>
      </div>

      <div class="hud">
        <div class="warning" id="deviceWarning">Open Spotify app in background!</div>
        <div class="hud-title" id="trackTitle">Awaiting Search</div>
        <div class="hud-meta">
          <span id="artistName">...</span> • <span id="sideBadge" style="color:var(--accent);">SIDE A</span>
        </div>
      </div>

      <div class="controls-grid">
        <button class="btn btn-primary" id="btnStart" onclick="triggerStartSequence()" disabled>START</button>
        <button class="btn" id="btnPause" onclick="btnPauseResume()" disabled>PAUSE</button>
        <button class="btn" onclick="btnStop()">STOP / PARK</button>
        <button class="btn" onclick="flipRecordManually()">FLIP SIDE</button>
      </div>
    </div>
  </div>

  <script>
    const CLIENT_ID = 'Fdf967e9e0294111a273b5469543c636';
    const REDIRECT_URI = window.location.origin + window.location.pathname; 
    
    // Mathematically corrected geometry for exact deck mapping
    const GROOVE_START = 142; const GROOVE_END = 55; const PLAYABLE_WIDTH = GROOVE_START - GROOVE_END;
    const PIVOT_REST_ANGLE = -3;  // Sits perfectly center on the rest block
    const PIVOT_OUTER_GROOVE = 13; // Reaches exact outer edge of vinyl
    const PIVOT_INNER_GROOVE = 37; // Reaches exact inner edge before center label

    let accessToken = null; 
    let albumData = null; let currentSide = 'A'; let currentSideTracks = [];
    let currentTrackIdx = 0; let trackLayout = [];
    
    let isPlaying = false; let isDragging = false;
    let trackStartTime = 0; let activeTrackDuration = 0; let currentAngle = PIVOT_REST_ANGLE;

    const vinyl = document.getElementById('vinyl'); const tonearm = document.getElementById('tonearm');
    const platterWrapper = document.getElementById('platterWrapper');
    const grooveSvg = document.getElementById('grooveSvg'); const trackTitle = document.getElementById('trackTitle');
    const warningTxt = document.getElementById('deviceWarning'); const resultsDropdown = document.getElementById('resultsDropdown');
    const startBtn = document.getElementById('btnStart'); const pauseBtn = document.getElementById('btnPause');

    // --- 1. PKCE AUTHENTICATION ---
    const generateRandomString = (length) => crypto.getRandomValues(new Uint8Array(length)).reduce((a, x) => a + 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'[x % 62], "");
    const sha256 = async (plain) => window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
    const base64encode = (input) => btoa(String.fromCharCode(...new Uint8Array(input))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');

    async function startSpotifyAuth() {
      const codeVerifier = generateRandomString(64);
      localStorage.setItem('code_verifier', codeVerifier);
      const codeChallenge = base64encode(await sha256(codeVerifier));
      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code', client_id: CLIENT_ID, scope: 'user-read-playback-state user-modify-playback-state',
        code_challenge_method: 'S256', code_challenge: codeChallenge, redirect_uri: REDIRECT_URI,
      }).toString();
      window.location.href = authUrl.toString();
    }

    async function checkAuth() {
      const code = new URLSearchParams(window.location.search).get('code');
      if (code) {
        const body = await fetch("https://accounts.spotify.com/api/token", {
          method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT_URI, code_verifier: localStorage.getItem('code_verifier') })
        });
        const res = await body.json();
        if (res.access_token) {
          accessToken = res.access_token;
          window.history.replaceState({}, document.title, window.location.pathname);
          document.getElementById('authOverlay').style.display = 'none';
          document.getElementById('appContainer').style.display = 'flex';
          startPlaybackPoller(); 
        }
      }
    }

    // --- 2. LIVE SEARCH & SMOOTH ALBUM SWAPPING ---
    let searchTimeout = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const q = e.target.value.trim();
      if(q.length < 2) return resultsDropdown.classList.remove('active');
      searchTimeout = setTimeout(async () => {
        const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(q)}&type=album&limit=5`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
        const data = await res.json();
        resultsDropdown.innerHTML = '';
        data.albums.items.forEach(album => {
          const div = document.createElement('div'); div.className = 'album-item';
          div.innerHTML = `<img src="${album.images[2].url}"><div class="album-info"><div class="album-title">${album.name}</div><div class="album-artist">${album.artists[0].name}</div></div>`;
          div.onclick = () => beginAlbumSwap(album); resultsDropdown.appendChild(div);
        });
        resultsDropdown.classList.add('active');
      }, 300);
    });

    async function beginAlbumSwap(album) {
      resultsDropdown.classList.remove('active');
      document.getElementById('searchInput').value = album.name;
      
      btnStop();
      startBtn.disabled = true;
      pauseBtn.disabled = true;

      // Slide old record out
      platterWrapper.classList.add('swapping-out');

      const res = await fetch(`https://api.spotify.com/v1/albums/${album.id}/tracks`, { headers: { 'Authorization': `Bearer ${accessToken}` } });
      const data = await res.json();
      
      const splitIdx = Math.ceil(data.items.length / 2);
      albumData = { uri: album.uri, meta: album, sideA: data.items.slice(0, splitIdx), sideB: data.items.slice(splitIdx) };

      setTimeout(() => {
        // Swap images while hidden
        document.getElementById('centerLabel').style.backgroundImage = `url(${album.images[0].url})`;
        document.getElementById('artistName').innerText = album.artists[0].name;
        loadSide('A', 0);
        
        platterWrapper.classList.remove('swapping-out');
        platterWrapper.classList.add('swapping-in-prep');
        
        // Force browser to register the swap before sliding in
        void platterWrapper.offsetWidth;
        
        platterWrapper.classList.remove('swapping-in-prep');
        trackTitle.innerText = "Ready - Press START";
        startBtn.disabled = false;
        pauseBtn.disabled = false;

      }, 600);
    }

    function loadSide(side, startIdx = 0) {
      currentSide = side; currentSideTracks = side === 'A' ? albumData.sideA : albumData.sideB;
      document.getElementById('sideBadge').innerText = `SIDE ${side}`;
      generatePhysicalGrooves(currentSideTracks);
    }

    function generatePhysicalGrooves(tracks) {
      let totalMs = tracks.reduce((sum, t) => sum + t.duration_ms, 0);
      let currentRadius = GROOVE_START;
      grooveSvg.innerHTML = ''; trackLayout = [];

      tracks.forEach((track, i) => {
        const trackInnerRadius = currentRadius - ((track.duration_ms / totalMs) * PLAYABLE_WIDTH);
        if (i < tracks.length - 1) {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', '145'); circle.setAttribute('cy', '145');
          circle.setAttribute('r', trackInnerRadius); circle.setAttribute('fill', 'none');
          circle.setAttribute('stroke', 'rgba(0,0,0,0.8)'); circle.setAttribute('stroke-width', '1.5');
          grooveSvg.appendChild(circle);
        }
        trackLayout.push({ 
          track: track, index: i, 
          startAngle: PIVOT_OUTER_GROOVE + ((GROOVE_START - currentRadius) / PLAYABLE_WIDTH) * (PIVOT_INNER_GROOVE - PIVOT_OUTER_GROOVE), 
          endAngle: PIVOT_OUTER_GROOVE + ((GROOVE_START - trackInnerRadius) / PLAYABLE_WIDTH) * (PIVOT_INNER_GROOVE - PIVOT_OUTER_GROOVE) 
        });
        currentRadius = trackInnerRadius;
      });
    }

    // --- 3. HIGH-PERFORMANCE NEEDLE SYNC ---
    function animationLoop() {
      if (isPlaying && !isDragging && activeTrackDuration > 0 && trackLayout[currentTrackIdx]) {
        let progressMs = Date.now() - trackStartTime;
        let layout = trackLayout[currentTrackIdx];
        
        if (progressMs > activeTrackDuration) progressMs = activeTrackDuration;
        
        let fraction = progressMs / activeTrackDuration;
        currentAngle = layout.startAngle + (fraction * (layout.endAngle - layout.startAngle));
        tonearm.style.transform = `rotate(${currentAngle}deg)`;
      }
      requestAnimationFrame(animationLoop);
    }
    requestAnimationFrame(animationLoop); 

    function startPlaybackPoller() {
      setInterval(async () => {
        if(!isPlaying) return;
        const res = await fetch('https://api.spotify.com/v1/me/player', { headers: { 'Authorization': `Bearer ${accessToken}` } });
        if(res.status === 200) {
          const data = await res.json();
          if(data.is_playing) {
            trackStartTime = Date.now() - data.progress_ms;
            const currentSpotifyId = data.item.id;
            if (trackLayout[currentTrackIdx] && trackLayout[currentTrackIdx].track.id !== currentSpotifyId) {
              const nextLayout = trackLayout.find(t => t.track.id === currentSpotifyId);
              if (nextLayout) {
                currentTrackIdx = nextLayout.index;
                activeTrackDuration = nextLayout.track.duration_ms;
                trackTitle.innerText = `${currentTrackIdx+1}. ${nextLayout.track.name}`;
              } else {
                triggerAutoFlip();
              }
            }
          }
        }
      }, 2000);
    }

    // --- 4. CONTROLS & API PLAYBACK ---
    function triggerStartSequence() {
      if(!albumData || isPlaying) return;
      
      startBtn.disabled = true;
      trackTitle.innerText = "Lowering Needle...";

      // CSS transition active during auto-swing
      tonearm.classList.add('swinging');
      tonearm.style.transform = `rotate(${trackLayout[currentTrackIdx || 0].startAngle}deg)`;

      setTimeout(() => {
        // Remove transition so the rendering loop can take precise control
        tonearm.classList.remove('swinging');
        playTrack(currentTrackIdx || 0, 0);
        startBtn.disabled = false;
      }, 600);
    }

    async function playTrack(idx, positionMs = 0) {
      if(!albumData) return;
      currentTrackIdx = idx;
      const trackObj = currentSideTracks[idx];
      activeTrackDuration = trackObj.duration_ms;
      trackStartTime = Date.now() - positionMs;
      warningTxt.style.display = 'none';

      const res = await fetch('https://api.spotify.com/v1/me/player/devices', { headers: { 'Authorization': `Bearer ${accessToken}` } });
      const devData = await res.json();
      const targetDevice = devData.devices.find(d => d.is_active)?.id || devData.devices[0]?.id;

      if(targetDevice) {
        await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${targetDevice}`, {
          method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ context_uri: albumData.uri, offset: { uri: trackObj.uri }, position_ms: positionMs })
        });
        isPlaying = true; vinyl.classList.add('spinning');
        trackTitle.innerText = `${idx+1}. ${trackObj.name}`;
      } else {
        warningTxt.style.display = 'block'; isPlaying = false;
      }
    }

    function btnPauseResume() {
      if (!albumData) return;
      if(isPlaying) {
        fetch(`https://api.spotify.com/v1/me/player/pause`, { method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}` } });
        isPlaying = false; vinyl.classList.remove('spinning');
      } else {
        if(currentAngle === PIVOT_REST_ANGLE) {
           triggerStartSequence();
        } else {
           playTrack(currentTrackIdx, Date.now() - trackStartTime);
        }
      }
    }

    function btnStop() {
      if(accessToken) fetch(`https://api.spotify.com/v1/me/player/pause`, { method: 'PUT', headers: { 'Authorization': `Bearer ${accessToken}` } });
      isPlaying = false; vinyl.classList.remove('spinning');
      
      tonearm.classList.add('swinging');
      currentAngle = PIVOT_REST_ANGLE; 
      tonearm.style.transform = `rotate(${currentAngle}deg)`;
      
      setTimeout(() => tonearm.classList.remove('swinging'), 600);
      currentTrackIdx = 0; trackTitle.innerText = "Needle Parked";
    }

    function triggerAutoFlip() {
      btnStop();
      trackTitle.innerText = `Flipping to Side ${currentSide === 'A' ? 'B' : 'A'}...`;
      setTimeout(() => {
        document.getElementById('platter').classList.add('flipping');
        setTimeout(() => {
          document.getElementById('platter').classList.remove('flipping');
          loadSide(currentSide === 'A' ? 'B' : 'A', 0);
          setTimeout(() => triggerStartSequence(), 800);
        }, 800);
      }, 500);
    }
    
    function flipRecordManually() { if(albumData) triggerAutoFlip(); }

    // --- 5. DRAG & DROP NEEDLE ---
    tonearm.addEventListener('touchstart', (e) => { 
      isDragging = true; vinyl.classList.remove('spinning'); 
      tonearm.classList.remove('swinging');
    });
    
    window.addEventListener('touchend', () => { 
      if(!isDragging) return;
      isDragging = false; 
      if(currentAngle >= PIVOT_OUTER_GROOVE && currentAngle <= PIVOT_INNER_GROOVE && albumData) {
        const target = trackLayout.find(t => currentAngle >= t.startAngle && currentAngle <= t.endAngle);
        if(target) {
          const fraction = (currentAngle - target.startAngle) / (target.endAngle - target.startAngle);
          playTrack(target.index, Math.floor(fraction * target.track.duration_ms));
        }
      } else {
        btnStop();
      }
    });

    window.addEventListener('touchmove', (e) => {
      if(!isDragging || !trackLayout.length) return;
      e.preventDefault();
      const clientX = e.touches[0].clientX; const clientY = e.touches[0].clientY;
      const pivotRect = document.querySelector('.tonearm-pivot').getBoundingClientRect();
      
      let angle = (Math.atan2(clientY - (pivotRect.top + pivotRect.height/2), clientX - (pivotRect.left + pivotRect.width/2)) * (180 / Math.PI)) - 90;
      if (angle < PIVOT_REST_ANGLE) angle = PIVOT_REST_ANGLE;
      if (angle > PIVOT_INNER_GROOVE + 5) angle = PIVOT_INNER_GROOVE + 5;
      
      currentAngle = angle; tonearm.style.transform = `rotate(${angle}deg)`;
      const hover = trackLayout.find(t => angle >= t.startAngle && angle <= t.endAngle);
      if(hover) trackTitle.innerText = `${hover.index+1}. ${hover.track.name}`;
    }, { passive: false });

    checkAuth();
  </script>
</body>
</html>
