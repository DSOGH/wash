<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Digital Vinyl Deck</title>
  <style>
    :root {
      --bg-color: #121212;
      --accent-color: #e63946;
      --vinyl-color: #1a1a1a;
      --platter-size: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

    .deck-container {
      position: relative;
      width: 360px;
      height: 480px;
      background: #222226;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      perspective: 1000px;
    }

    /* Turntable Platter */
    .platter-wrapper {
      position: relative;
      width: var(--platter-size);
      height: var(--platter-size);
      perspective: 800px;
    }

    .record-platter {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #333 0%, #111 70%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .record-platter.flipping {
      transform: rotateY(180deg) scale(0.9);
    }

    .vinyl {
      position: relative;
      width: 96%;
      height: 96%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle,
        var(--vinyl-color) 0px,
        var(--vinyl-color) 2px,
        #0d0d0d 3px,
        #0d0d0d 4px
      );
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .vinyl.spinning {
      animation: spin 2.22s linear infinite; /* ~33 RPM */
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .vinyl-grooves {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
      pointer-events: none;
    }

    /* Center Label Art */
    .center-label {
      position: relative;
      width: 35%;
      height: 35%;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 4px solid var(--accent-color);
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spindle-hole {
      width: 12px;
      height: 12px;
      background: #121212;
      border: 2px solid #666;
      border-radius: 50%;
    }

    /* Audio-Technica Stylus/Tonearm */
    .tonearm-base {
      position: absolute;
      top: 15px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #888, #333);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .tonearm {
      position: absolute;
      top: 20px;
      right: 35px;
      width: 6px;
      height: 190px;
      background: linear-gradient(to right, #ccc, #fff, #999);
      border-radius: 3px;
      transform-origin: top center;
      transform: rotate(-32deg); /* Rest position */
      transition: transform 0.3s ease-out;
      z-index: 9;
      box-shadow: -2px 5px 10px rgba(0,0,0,0.4);
    }

    .headshell {
      position: absolute;
      bottom: -15px;
      left: -5px;
      width: 16px;
      height: 25px;
      background: #111;
      border-radius: 2px;
      transform: rotate(15deg);
    }

    .stylus-light {
      position: absolute;
      bottom: 2px;
      left: 6px;
      width: 4px;
      height: 4px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 6px #00e5ff;
    }

    /* Controls & Info */
    .info-panel {
      margin-top: 25px;
      text-align: center;
      width: 90%;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album-meta {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      align-items: center;
      justify-content: center;
    }

    .btn {
      background: #333;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .side-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #444;
      border-radius: 10px;
      font-size: 0.75rem;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <div class="deck-container">
    <div class="platter-wrapper">
      <div class="record-platter" id="platter">
        <div class="vinyl" id="vinyl">
          <div class="vinyl-grooves"></div>
          <div class="center-label" id="centerLabel">
            <div class="spindle-hole"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tonearm Assembly -->
    <div class="tonearm-base"></div>
    <div class="tonearm" id="tonearm">
      <div class="headshell">
        <div class="stylus-light"></div>
      </div>
    </div>

    <!-- Display / Controls -->
    <div class="info-panel">
      <div class="track-title" id="trackTitle">Tap "Play" or Place Needle</div>
      <div class="album-meta">
        <span id="albumName">Demo Album</span>
        <span class="side-badge" id="sideBadge">SIDE A</span>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="playBtn">Play / Pause</button>
        <button class="btn" id="flipBtn">Flip Record</button>
      </div>
    </div>
  </div>

  <script>
    // Demo Tracklist (Splits Side A and Side B)
    const albumData = {
      title: "Random Access Memories",
      artist: "Daft Punk",
      coverUrl: "https://upload.wikimedia.org/wikipedia/en/a/a7/Random_Access_Memories.jpg",
      accentColor: "#d4af37",
      sideA: [
        { title: "1. Give Life Back to Music", duration: 15 },
        { title: "2. The Game of Love", duration: 15 },
        { title: "3. Giorgio by Moroder", duration: 20 }
      ],
      sideB: [
        { title: "4. Within", duration: 15 },
        { title: "5. Instant Crush", duration: 20 },
        { title: "6. Lose Yourself to Dance", duration: 20 }
      ]
    };

    let currentSide = 'A';
    let currentTrackIdx = 0;
    let isPlaying = false;
    let playInterval = null;
    let trackProgress = 0; // 0 to 100%

    // DOM Elements
    const vinyl = document.getElementById('vinyl');
    const platter = document.getElementById('platter');
    const tonearm = document.getElementById('tonearm');
    const centerLabel = document.getElementById('centerLabel');
    const playBtn = document.getElementById('playBtn');
    const flipBtn = document.getElementById('flipBtn');
    const trackTitle = document.getElementById('trackTitle');
    const sideBadge = document.getElementById('sideBadge');
    const albumName = document.getElementById('albumName');

    // Angle mapping for Audio-Technica tonearm:
    // Rest Angle: -32deg, Outer Groove: -12deg, Inner Groove: +12deg
    const REST_ANGLE = -32;
    const OUTER_GROOVE = -14;
    const INNER_GROOVE = 12;

    // Initialize UI
    function initDeck() {
      centerLabel.style.backgroundImage = `url('${albumData.coverUrl}')`;
      document.documentElement.style.setProperty('--accent-color', albumData.accentColor);
      albumName.innerText = `${albumData.artist} - ${albumData.title}`;
      updateTrackInfo();
    }

    function updateTrackInfo() {
      const tracks = currentSide === 'A' ? albumData.sideA : albumData.sideB;
      if (tracks[currentTrackIdx]) {
        trackTitle.innerText = tracks[currentTrackIdx].title;
      } else {
        trackTitle.innerText = "End of Side " + currentSide;
      }
      sideBadge.innerText = "SIDE " + currentSide;
    }

    function setTonearmPosition(percent) {
      // Map 0 - 100% progress across all tracks on current side to angle
      const angle = OUTER_GROOVE + (percent / 100) * (INNER_GROOVE - OUTER_GROOVE);
      tonearm.style.transform = `rotate(${angle}deg)`;
    }

    function play() {
      if (isPlaying) return;
      isPlaying = true;
      vinyl.classList.add('spinning');
      playBtn.innerText = 'Pause';

      playInterval = setInterval(() => {
        trackProgress += 0.5; // Simulate needle advancing
        setTonearmPosition(trackProgress);

        // Calculate current track from progress
        const tracks = currentSide === 'A' ? albumData.sideA : albumData.sideB;
        const trackStep = 100 / tracks.length;
        const newTrackIdx = Math.min(Math.floor(trackProgress / trackStep), tracks.length - 1);

        if (newTrackIdx !== currentTrackIdx) {
          currentTrackIdx = newTrackIdx;
          updateTrackInfo();
        }

        // Side completed -> Auto return needle & Flip!
        if (trackProgress >= 100) {
          autoFlipRecord();
        }
      }, 200);
    }

    function pause() {
      isPlaying = false;
      vinyl.classList.remove('spinning');
      playBtn.innerText = 'Play';
      clearInterval(playInterval);
    }

    function parkTonearm() {
      pause();
      tonearm.style.transform = `rotate(${REST_ANGLE}deg)`;
      trackProgress = 0;
      currentTrackIdx = 0;
    }

    function autoFlipRecord() {
      parkTonearm();
      trackTitle.innerText = `Side ${currentSide} Finished. Flipping...`;

      setTimeout(() => {
        platter.classList.add('flipping');
        setTimeout(() => {
          currentSide = currentSide === 'A' ? 'B' : 'A';
          updateTrackInfo();
          platter.classList.remove('flipping');
          // Auto start next side after flip
          setTimeout(() => { play(); }, 600);
        }, 400);
      }, 500);
    }

    // Event Listeners
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        pause();
      } else {
        if (trackProgress >= 100) trackProgress = 0;
        play();
      }
    });

    flipBtn.addEventListener('click', () => {
      autoFlipRecord();
    });

    // Tap/Drag platter to move needle to location
    platter.addEventListener('click', (e) => {
      const rect = platter.getBoundingClientRect();
      const clickRadius = Math.hypot(e.clientX - (rect.left + rect.width/2), e.clientY - (rect.top + rect.height/2));
      const maxRadius = rect.width / 2;
      
      // Calculate normalized position on vinyl (0% inner edge to 100% outer edge)
      let relativePos = (clickRadius / maxRadius);
      if (relativePos > 0.35 && relativePos < 0.95) {
        trackProgress = (1 - ((relativePos - 0.35) / 0.60)) * 100;
        trackProgress = Math.max(0, Math.min(100, trackProgress));
        setTonearmPosition(trackProgress);
        const tracks = currentSide === 'A' ? albumData.sideA : albumData.sideB;
        currentTrackIdx = Math.min(Math.floor((trackProgress / 100) * tracks.length), tracks.length - 1);
        updateTrackInfo();
        if (!isPlaying) play();
      }
    });

    initDeck();
  </script>
</body>
</html>
