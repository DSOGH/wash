<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2021 M340i xDrive Tuning Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            color: #F3F4F6;
        }
        .m-stripe {
            height: 4px;
            background: linear-gradient(90deg, #008CB5 33%, #001C58 33%, #001C58 66%, #E21B4D 66%);
        }
        .btn-selected {
            background-color: #2563EB;
            border-color: #3B82F6;
            color: white;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .btn-unselected {
            background-color: #374151;
            border-color: #4B5563;
            color: #D1D5DB;
        }
        .btn-unselected:hover {
            background-color: #4B5563;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <div class="max-w-5xl w-full bg-gray-800 rounded-2xl shadow-2xl overflow-hidden border border-gray-700">
        <!-- M-Performance Header Stripe -->
        <div class="m-stripe w-full"></div>
        
        <div class="p-6 sm:p-10">
            <h1 class="text-3xl font-extrabold text-white mb-2 tracking-tight">B58TU Tuning Configurator</h1>
            <p class="text-gray-400 mb-8">2021 BMW M340i xDrive (Mild Hybrid) • Dynamic Power Estimator</p>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                
                <!-- Controls Column -->
                <div class="space-y-8">
                    
                    <!-- Stage Selection -->
                    <div>
                        <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">1. Select Tune Stage</h2>
                        <div class="grid grid-cols-3 gap-3">
                            <button id="btn-stock" class="config-btn btn-selected py-3 rounded-lg border font-semibold transition-all" onclick="updateConfig('stage', 'Stock')">Stock</button>
                            <button id="btn-stage1" class="config-btn btn-unselected py-3 rounded-lg border font-semibold transition-all" onclick="updateConfig('stage', 'Stage 1')">Stage 1</button>
                            <button id="btn-stage2" class="config-btn btn-unselected py-3 rounded-lg border font-semibold transition-all" onclick="updateConfig('stage', 'Stage 2')">Stage 2</button>
                        </div>
                    </div>

                    <!-- Fuel Selection -->
                    <div>
                        <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">2. Select Fuel Type</h2>
                        <div class="grid grid-cols-3 gap-3">
                            <button id="btn-93" class="config-btn btn-selected py-3 rounded-lg border font-semibold transition-all" onclick="updateConfig('fuel', '93 Oct')">93 Octane</button>
                            <button id="btn-e30" class="config-btn btn-unselected py-3 rounded-lg border font-semibold transition-all" onclick="updateConfig('fuel', 'E30')">E30 Blend</button>
                            <button id="btn-e50" class="config-btn btn-unselected py-3 rounded-lg border font-semibold transition-all" onclick="updateConfig('fuel', 'E50')">E50 Blend</button>
                        </div>
                    </div>

                    <!-- Transmission Selection -->
                    <div>
                        <h2 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">3. Transmission Tune</h2>
                        <label class="flex items-center space-x-3 cursor-pointer bg-gray-700 p-4 rounded-lg border border-gray-600 hover:bg-gray-600 transition-all">
                            <input type="checkbox" id="xhp-toggle" class="form-checkbox h-5 w-5 text-blue-600 rounded focus:ring-blue-500 bg-gray-800 border-gray-500" onchange="updateConfig('xhp', this.checked)">
                            <span class="text-white font-semibold">Enable xHP Stage 2/3</span>
                        </label>
                    </div>

                </div>

                <!-- Chart & Output Column -->
                <div class="bg-gray-900 p-6 rounded-xl border border-gray-700 flex flex-col justify-between">
                    
                    <!-- Canvas Container for Chart -->
                    <div class="relative h-64 w-full mb-6">
                        <canvas id="powerChart"></canvas>
                    </div>

                    <!-- Requirements Box -->
                    <div class="bg-gray-800 rounded-lg p-5 border-l-4 border-blue-500">
                        <h3 class="text-lg font-bold text-white mb-2">Hardware & Flash Requirements</h3>
                        <ul id="requirements-list" class="list-disc list-inside text-sm text-gray-300 space-y-2">
                            <!-- Injected via JS -->
                        </ul>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let config = {
            stage: 'Stock',
            fuel: '93 Oct',
            xhp: false
        };

        // Data Dictionary (Crank estimates for visualization)
        const powerData = {
            'Stock': {
                '93 Oct': { hp: 382, tq: 369 },
                'E30': { hp: 382, tq: 369 }, // Can't run E30 on stock map safely
                'E50': { hp: 382, tq: 369 }  // Can't run E50 on stock map safely
            },
            'Stage 1': {
                '93 Oct': { hp: 440, tq: 440 },
                'E30': { hp: 470, tq: 470 },
                'E50': { hp: 485, tq: 490 } // Borderline for TU pump, needs custom tune
            },
            'Stage 2': {
                '93 Oct': { hp: 470, tq: 480 },
                'E30': { hp: 500, tq: 520 },
                'E50': { hp: 530, tq: 550 } // Maxing out stock TU pump
            }
        };

        // Chart Initialization
        const ctx = document.getElementById('powerChart').getContext('2d');
        const powerChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Horsepower (HP)', 'Torque (ft-lbs)'],
                datasets: [{
                    label: 'Power Output',
                    data: [382, 369],
                    backgroundColor: [
                        'rgba(37, 99, 235, 0.8)', // Blue for HP
                        'rgba(226, 27, 77, 0.8)'  // Red for TQ
                    ],
                    borderColor: [
                        'rgba(37, 99, 235, 1)',
                        'rgba(226, 27, 77, 1)'
                    ],
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false,
                        min: 300,
                        max: 600,
                        grid: {
                            color: '#374151'
                        },
                        ticks: {
                            color: '#9CA3AF'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#D1D5DB',
                            font: { size: 14, weight: 'bold' }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: '#1F2937',
                        titleFont: { size: 14 },
                        bodyFont: { size: 16, weight: 'bold' },
                        padding: 12,
                        displayColors: false
                    }
                },
                animation: {
                    duration: 800,
                    easing: 'easeOutQuart'
                }
            }
        });

        // Main Update Function
        function updateConfig(type, value) {
            if (type !== 'xhp') {
                config[type] = value;
                
                // Update UI Buttons
                const prefix = type === 'stage' ? 'stage' : 'fuel';
                let btnIdBase = '';
                if(type === 'stage') {
                    if(value === 'Stock') btnIdBase = 'btn-stock';
                    if(value === 'Stage 1') btnIdBase = 'btn-stage1';
                    if(value === 'Stage 2') btnIdBase = 'btn-stage2';
                } else {
                    if(value === '93 Oct') btnIdBase = 'btn-93';
                    if(value === 'E30') btnIdBase = 'btn-e30';
                    if(value === 'E50') btnIdBase = 'btn-e50';
                }

                // Reset siblings
                const groupPrefix = type === 'stage' ? 'btn-st' : 'btn-';
                document.querySelectorAll(`[id^="btn-"]`).forEach(btn => {
                    if((type === 'stage' && (btn.id.includes('stock') || btn.id.includes('stage'))) || 
                       (type === 'fuel' && (btn.id.includes('93') || btn.id.includes('e30') || btn.id.includes('e50')))) {
                        btn.classList.remove('btn-selected');
                        btn.classList.add('btn-unselected');
                    }
                });

                // Set active
                const activeBtn = document.getElementById(btnIdBase);
                activeBtn.classList.remove('btn-unselected');
                activeBtn.classList.add('btn-selected');

            } else {
                config.xhp = value;
            }

            refreshDashboard();
        }

        // Refresh Data and UI
        function refreshDashboard() {
            // Get data based on config
            let hp = powerData[config.stage][config.fuel].hp;
            let tq = powerData[config.stage][config.fuel].tq;

            // Minor adjustments if xHP is enabled (doesn't add peak HP, but helps hold torque)
            if (config.xhp && config.stage !== 'Stock') {
                tq += 15; // Visual representation of removed torque limiters
            }

            // Update Chart
            powerChart.data.datasets[0].data = [hp, tq];
            powerChart.update();

            // Update Requirements List
            const reqList = document.getElementById('requirements-list');
            reqList.innerHTML = '';

            // 1. FEMTO Unlock (Mandatory for 2021+)
            if (config.stage !== 'Stock') {
                reqList.innerHTML += `<li><span class="font-bold text-red-400">FEMTO Bench Unlock:</span> Mandatory for your 2021 model (Bosch DME is locked).</li>`;
                reqList.innerHTML += `<li><span class="font-bold text-blue-400">MHD / BM3 License:</span> Required to flash the engine control unit.</li>`;
            } else {
                reqList.innerHTML += `<li>Factory hardware and locked DME. Fully warrantied.</li>`;
                if(config.fuel !== '93 Oct') {
                     reqList.innerHTML += `<li><span class="text-yellow-400">Note:</span> Do not run E30/E50 without an engine tune!</li>`;
                }
            }

            // 2. Downpipe (Stage 2)
            if (config.stage === 'Stage 2') {
                reqList.innerHTML += `<li><span class="font-bold text-blue-400">Upgraded Downpipe:</span> High-flow catted or catless required to manage backpressure.</li>`;
            }

            // 3. Fuel Setup
            if (config.fuel === 'E30' && config.stage !== 'Stock') {
                reqList.innerHTML += `<li><span class="font-bold text-purple-400">Ethanol Toolkit:</span> E85 test kit and mixing calculator to ensure accurate E30 blend.</li>`;
            } else if (config.fuel === 'E50' && config.stage !== 'Stock') {
                reqList.innerHTML += `<li><span class="font-bold text-purple-400">Custom Tune / Fueling:</span> Pushing the limits of the stock Gen 2 TU HPFP. A custom tune via MHD+ is highly recommended.</li>`;
            }

            // 4. xHP
            if (config.xhp) {
                reqList.innerHTML += `<li><span class="font-bold text-green-400">xHP Flashtool:</span> Removes 6th gear torque limiters, increases line pressure, and speeds up ZF8 shifts.</li>`;
            } else if (config.stage === 'Stage 2' || config.fuel === 'E50') {
                reqList.innerHTML += `<li><span class="text-yellow-400">Warning:</span> Stock transmission mapping will cap torque output and may slip clutches at this power level. xHP recommended.</li>`;
            }
        }

        // Initial Load
        refreshDashboard();

    </script>
</body>
</html>
