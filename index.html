<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPhone OCR Blackjack Counter</title>
  <!-- Load Tesseract.js directly from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #1e293b;
      --accent: #10b981;
      --warn: #f59e0b;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; align-items: center; }

    .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .status { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: #334155; }
    .status.active { background: #064e3b; color: #34d399; }

    .camera-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    /* Scanning Target Box */
    .scan-zone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 180px;
      border: 3px dashed var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
    }

    .zone-label { font-size: 0.75rem; font-weight: 700; color: var(--accent); background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; align-self: center; }

    .dashboard {
      width: 100%; max-width: 480px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0;
    }
    .stat-card { background: var(--card); border-radius: 12px; padding: 10px; text-align: center; }
    .stat-label { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }
    .stat-val { font-size: 1.4rem; font-weight: 800; }

    .controls { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 8px; }
    .btn { border: none; border-radius: 12px; padding: 14px; font-weight: 700; color: white; cursor: pointer; }
    .btn-scan { background: #3b82f6; font-size: 1rem; }
    .btn-reset { background: #ef4444; }
    
    /* Hidden canvas for cropping scan area */
    #cropCanvas { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h3>Card Text OCR Tracker</h3>
    <span id="ocrStatus" class="status">Loading Engine...</span>
  </div>

  <div class="camera-container">
    <video id="video" playsinline autoplay muted></video>
    <div class="scan-zone">
      <span class="zone-label" id="targetLabel">ALIGN CARD HERE</span>
    </div>
  </div>

  <canvas id="cropCanvas"></canvas>

  <div class="dashboard">
    <div class="stat-card">
      <div class="stat-label">Running</div>
      <div id="runningCount" class="stat-val">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">True Count</div>
      <div id="trueCount" class="stat-val" style="color:var(--accent);">0.0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last Detected</div>
      <div id="lastCard" class="stat-val" style="color:var(--warn);">-</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-scan" onclick="scanTargetZone()">SNAP & SCAN CARD</button>
    <button class="btn btn-reset" onclick="resetCount()">RESET SHOE</button>
  </div>

  <script>
    let worker = null;
    let runningCount = 0;
    let cardsDealt = 0;

    // 1. Initialize Tesseract OCR Engine (Configured for digits/letters)
    async function initOCR() {
      const status = document.getElementById('ocrStatus');
      worker = await Tesseract.createWorker('eng');
      // Restrict OCR to only characters found on playing cards
      await worker.setParameters({
        tessedit_char_whitelist: '2345678910JQKA',
      });
      status.innerText = 'OCR Engine Ready';
      status.classList.add('active');
      startiPhoneCamera();
    }

    // 2. Access iPhone Rear Camera
    async function startiPhoneCamera() {
      const video = document.getElementById('video');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        video.srcObject = stream;
      } catch (e) {
        // Fallback for desktop testing
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      }
    }

    // 3. Crop Zone & Scan for Card Values
    async function scanTargetZone() {
      if (!worker) return;
      const video = document.getElementById('video');
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');

      // Set crop canvas size
      canvas.width = 200;
      canvas.height = 250;

      // Draw middle section of video stream onto hidden canvas
      const startX = (video.videoWidth - 200) / 2;
      const startY = (video.videoHeight - 250) / 2;
      ctx.drawImage(video, startX, startY, 200, 250, 0, 0, 200, 250);

      document.getElementById('ocrStatus').innerText = 'Scanning...';

      // Perform OCR on cropped canvas
      const ret = await worker.recognize(canvas);
      const text = ret.data.text.trim().toUpperCase();

      document.getElementById('ocrStatus').innerText = 'OCR Engine Ready';
      processRecognizedRank(text);
    }

    // 4. Update Hi-Lo Card Count Math
    function processRecognizedRank(text) {
      if (!text) return;
      
      let val = 0;
      let cardLabel = text;

      if (['2','3','4','5','6'].some(c => text.includes(c))) {
        val = 1; // +1 for 2-6
      } else if (['7','8','9'].some(c => text.includes(c))) {
        val = 0; // Neutral 0
      } else if (['10','J','Q','K','A'].some(c => text.includes(c))) {
        val = -1; // -1 for High Cards
      } else {
        return; // Ignore unrecognized symbols
      }

      // iPhone Haptic Feedback Trigger
      if (navigator.vibrate) navigator.vibrate(50);

      runningCount += val;
      cardsDealt++;

      // Standard 6-Deck True Count formula
      const decksRemaining = Math.max(0.5, (6 * 52 - cardsDealt) / 52);
      const trueCount = (runningCount / decksRemaining).toFixed(1);

      document.getElementById('runningCount').innerText = runningCount > 0 ? `+${runningCount}` : runningCount;
      document.getElementById('trueCount').innerText = trueCount > 0 ? `+${trueCount}` : trueCount;
      document.getElementById('lastCard').innerText = cardLabel;
    }

    function resetCount() {
      runningCount = 0;
      cardsDealt = 0;
      document.getElementById('runningCount').innerText = '0';
      document.getElementById('trueCount').innerText = '0.0';
      document.getElementById('lastCard').innerText = '-';
    }

    // Load OCR when window opens
    window.onload = initOCR;
  </script>
</body>
</html>
